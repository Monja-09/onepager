<DOCTYPE! html>
    <html lang="de">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!--Embed Javascript-->
        <script src="script.js"></script>

        <!-- Embed Stylesheet -->
        <link rel="stylesheet" href="style.css">

        <!-- Embed Overpass -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link
            href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:ital,wght@0,100..900;1,100..900&display=swap"
            rel="stylesheet">

        <title>FCSG</title>
    </head>

    <body>

        <!-- Header -->
        <header>
            <!-- Navigation -->
            <nav class="nav-header">
                <ul>
                    <li><a href="#cuptrikot">Cuptrikot</a></li>
                    <li><a href="#team">Team</a></li>
                    <li><a href="#newsletter">Newsletter</a></li>
                    <li class="puc"><a href="index.html"><img src="Assets/Bilder/Pokal.svg"></a></li>
                </ul>
            </nav>
        </header>

        <!--start-main-->
        <main>
            <section class="hero-section">
                <div class="title">
                    <h1>Cupfinal 2026!</h1>
                    <p>Sonntag, 24.05.2026, 14 Uhr, Wankdorf</p>
                </div>
            </section>
            <section class="match-time-section">
                <div class="match-time-div">
                    <div class="match">
                        <div id="slo">
                            <p id="name-slo">FC Stade-<br>Lausanne-Ouchy</p>
                            <img class="logos" src="Assets/Bilder/cropped-640px-FC_Stade_Lausanne_Ouchy-copie.png"
                                alt="Logo Stade-Lausanne-Ouchy">
                        </div>
                        <p>VS</p>
                        <div id="fcsg">
                            <img class="logos" src="Assets/Bilder/logo.svg" alt="Logo FCSG">
                            <p>FC St.Gallen 1879</p>
                        </div>
                    </div>

                    <div id="countdown-container">
                        <div class="time-box">
                            <p>Tage</p>
                            <span id="tage">00</span>
                        </div>
                        <div class="time-box">
                            <p>Stunden</p>
                            <span id="stunden">00</span>
                        </div>
                        <div class="time-box">
                            <p>Minuten</p>
                            <span id="minuten">00</span>
                        </div>
                        <div class="time-box">
                            <p>Sekunden</p>
                            <span id="sekunden">00</span>
                        </div>
                    </div>

                    <script src="script.js"></script>
                </div>
            </section>
        </main>


    </body>

    </html>
